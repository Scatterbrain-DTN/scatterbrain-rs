[package]
name = "scatterbrain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
byteorder = "1.5.0"
crc = "3.2.1"
env_logger = "0.11.3"
futures = { version = "0.3.30", features = ["io-compat", "compat"] }
log = "0.4.22"
mdns-sd = "0.11.1"
prost = "0.13.5"
prost-types = "0.13.5"
serde = { version = "1.0.204", features = ["derive"] }
dryoc = { version = "0.6.1", features = ["serde", "base64", "nightly"] }
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
    "sync",
] }
uuid = { version = "1.10.0", features = ["serde", "v4"] }
rusqlite = { version = "0.32.1", features = [
    "wasm32-wasi-vfs",
    "uuid",
    "chrono",
    "bundled-full",
] }
bip39 = "2.0.0"
chrono = "0.4.38"
serde_json = "1.0.127"
flutter_rust_bridge = { version = "=2.7.0", features = [
    "uuid",
    "chrono",
], optional = true }
rusqlite_migration = "1.3.1"
tokio-util = "0.7.12"
async-trait = "0.1.83"
anyhow = { version = "1.0.89", features = ["backtrace"] }
base64 = "0.22.1"
lazy_static = "1.5.0"
fallible-iterator = "0.3.0"
zeroize = "1.8.1"


[build-dependencies]
prost-build = "0.13.0"

[features]
flutter_gen = ["flutter"]
flutter = ["dep:flutter_rust_bridge"]
